<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>攀岩模擬賽計分</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#DCE0DA; --panel:#F4F6F2; --ink:#1E2A2E; --muted:#5F6B6E; --line:#B9C0B8;
  --zone:#E8B21C; --zone-ink:#3A2C00; --top:#CF3B32; --top-ink:#fff; --fail:#8A9496;
  --btn:#1E2A2E; --btn-ink:#F4F6F2; --rest:#2F7D6B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#1B2225; --panel:#253034; --ink:#E6EAE5; --muted:#9AA6A8; --line:#3A474B;
    --zone:#E8B21C; --zone-ink:#2A2000; --top:#E0564C; --top-ink:#fff; --fail:#6F7A7C;
    --btn:#E6EAE5; --btn-ink:#1B2225; --rest:#4FAF97;
  }
}
:root[data-theme="dark"]{
  --wall:#1B2225; --panel:#253034; --ink:#E6EAE5; --muted:#9AA6A8; --line:#3A474B;
  --zone:#E8B21C; --zone-ink:#2A2000; --top:#E0564C; --top-ink:#fff; --fail:#6F7A7C;
  --btn:#E6EAE5; --btn-ink:#1B2225; --rest:#4FAF97;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--wall);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
[hidden]{display:none !important}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:3px solid var(--zone);outline-offset:2px}
.btn{background:var(--btn);color:var(--btn-ink);font-weight:700;padding:12px 18px;white-space:nowrap}
.btn.big{width:100%;padding:16px;font-size:1.1rem;font-weight:900}
.link{background:none;color:var(--muted);padding:6px 0;text-decoration:underline;font-size:.875rem}
.link.danger{color:var(--top)}
.link:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--panel);border-radius:14px;padding:18px;margin-bottom:20px}
.rule{color:var(--muted);font-size:.875rem;margin:4px 0 12px}
.banner{font-size:.8rem;padding:8px 12px;border-radius:10px;background:var(--panel);color:var(--muted);margin-bottom:12px}
.banner b{color:var(--ink)}
.center{text-align:center;padding:48px 16px;color:var(--muted)}

.setup h1{font-size:1.6rem;font-weight:900;margin:8px 0 4px}
.field{margin-bottom:20px}
.field label{display:block;font-weight:700;margin-bottom:8px}
.field .note{font-size:.8rem;color:var(--muted);margin-top:6px}
.text{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--wall);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:52px;height:52px;font-size:1.5rem;font-weight:900;background:var(--wall);color:var(--ink)}
.stepper output{min-width:72px;text-align:center;font-size:2.25rem;font-weight:900;font-variant-numeric:tabular-nums}
.stepper .unit{color:var(--muted);font-weight:700}

.timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--btn);color:var(--btn-ink);
  border-radius:0 0 14px 14px;margin:-16px -16px 16px;padding:12px 16px;display:flex;align-items:center;gap:10px}
.timer.rest{background:var(--rest);color:#fff}
.timer.warn{background:var(--zone);color:var(--zone-ink)}
.timer.over{background:var(--top);color:var(--top-ink)}
.t-info{flex:1;min-width:0}
.t-phase{font-size:.8rem;font-weight:700;opacity:.85}
.t-clock{font-size:2.6rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.t-btns{display:flex;gap:6px}
.t-btns button{background:rgba(127,127,127,.3);color:inherit;font-weight:900;padding:12px}
.t-btns .main{min-width:68px}

.title{font-weight:900;font-size:1.5rem;margin:0;word-break:break-all}
.add{display:flex;gap:8px;margin-bottom:16px}
.add input{flex:1;font:inherit;font-size:1rem;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.tab{background:var(--panel);color:var(--ink);font-weight:700;padding:10px 16px;white-space:nowrap}
.tab.on{background:var(--btn);color:var(--btn-ink)}
.tab.total.on{background:var(--top);color:var(--top-ink)}
.now-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.now-name{font-size:1.375rem;font-weight:900;margin:0;word-break:break-all}
.now-route{font-size:.8rem;color:var(--muted);margin:0}
.big-score{font-size:2.75rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.status{color:var(--muted);font-size:.875rem;margin:6px 0 14px}
.strip{display:flex;flex-wrap:wrap;gap:6px;min-height:36px;margin-bottom:16px;padding:8px;border:2px dashed var(--line);border-radius:10px}
.strip:empty::before{content:"還沒有嘗試紀錄";color:var(--muted);font-size:.875rem;align-self:center}
.chip{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.8rem}
.chip.f{background:var(--fail);color:#fff}
.chip.z{background:var(--zone);color:var(--zone-ink)}
.chip.t{background:var(--top);color:var(--top-ink)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.act{padding:18px 8px;font-weight:900;font-size:1.05rem}
.act small{display:block;font-weight:500;font-size:.75rem;opacity:.85}
.act.f{background:var(--fail);color:#fff}
.act.z{background:var(--zone);color:var(--zone-ink)}
.act.t{background:var(--top);color:var(--top-ink)}
.act:disabled{opacity:.35;cursor:not-allowed}
.sub{display:flex;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
h2{font-size:1rem;margin:0}
.hint{font-size:.8rem;color:var(--muted)}
.board{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:12px 10px;border-radius:10px}
.row.click{cursor:pointer}
.row + .row{border-top:1px solid var(--line)}
.row.sel{background:var(--wall)}
.row.me .rname::after{content:"（你）";color:var(--top);font-weight:900;margin-left:4px}
.rank{font-weight:900;font-size:1.1rem;text-align:center}
.rank.p1{color:var(--top)}
.rname{font-weight:700;word-break:break-all}
.rdetail{font-size:.8rem;color:var(--muted)}
.rscore{font-weight:900;font-variant-numeric:tabular-nums;font-size:1.15rem;text-align:right}
.mini{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mini span{font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--wall);color:var(--muted);font-variant-numeric:tabular-nums}
.mini span.t{background:var(--top);color:var(--top-ink)}
.mini span.z{background:var(--zone);color:var(--zone-ink)}
.divtabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-bottom:10px;background:var(--panel);padding:4px;border-radius:12px}
.divtab{background:transparent;color:var(--ink);font-weight:900;padding:10px}
.divtab.on{background:var(--btn);color:var(--btn-ink)}
.photo{margin:0 0 14px;border-radius:12px;overflow:hidden;background:var(--wall);cursor:zoom-in;display:flex;justify-content:center}
.pwrap{position:relative;max-width:100%}
.pwrap img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pwrap svg{position:absolute;inset:0;width:100%;height:100%}
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);cursor:zoom-out}
.editor{position:fixed;inset:0;z-index:30;background:#111;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.ed-top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:8px}
.ed-top b{font-size:1rem}
.ed-top button{padding:10px 16px;font-weight:900}
.ed-cancel{background:#333;color:#fff}
.ed-save{background:var(--top);color:#fff}
.ed-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ed-stage svg{touch-action:none;cursor:crosshair}
.ed-bar{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;background:#1b1b1b}
.ed-tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ed-tools button{background:#2a2a2a;color:#fff;padding:10px 4px;font-weight:900;font-size:.85rem;border:2px solid transparent}
.ed-tools button.on{border-color:#fff}
.ed-tools i{display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid currentColor;vertical-align:-1px;margin-right:4px}
.ed-row{display:flex;align-items:center;gap:10px;font-size:.85rem}
.ed-row input[type=range]{flex:1;accent-color:#fff}
.ed-row button{background:#2a2a2a;color:#fff;padding:8px 12px;font-weight:700}
.ed-row button:disabled{opacity:.35}
.ed-hint{font-size:.75rem;color:#aaa;margin:0}
.divcard{border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.divcard .row2{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.divcard .row2 input{flex:1}
.seg{display:flex;gap:6px;margin-bottom:16px}
.seg button{flex:1;background:var(--panel);color:var(--ink);font-weight:700;padding:10px;border:2px solid transparent}
.seg button.on{border-color:var(--btn)}
.portal h1{font-size:1.6rem;font-weight:900;margin:8px 0 4px}
.comp-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.comp-item{background:var(--panel);border-radius:14px;padding:16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.comp-item:focus-visible{outline:3px solid var(--zone);outline-offset:2px}
.comp-item h3{margin:0;font-size:1.1rem;font-weight:900;word-break:break-all}
.comp-item p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.badge{font-size:.72rem;font-weight:900;padding:3px 9px;border-radius:999px;background:var(--wall);color:var(--muted);white-space:nowrap}
.badge.live{background:var(--top);color:var(--top-ink)}
.back{background:none;color:var(--muted);font-weight:700;padding:6px 0;margin-bottom:6px}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.foot{display:flex;justify-content:center;gap:24px;margin-top:8px;flex-wrap:wrap}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<main>

<div class="center" id="loadingView">連線中…</div>

<section class="portal" id="portalView" hidden>
  <h1>攀岩比賽</h1>
  <p class="rule">選一場比賽報名參加、看成績，或建立你自己的比賽。</p>
  <div class="banner" id="portalBanner"></div>
  <button class="btn big" id="newCompBtn" style="margin-bottom:16px">＋ 建立新比賽</button>
  <ul class="comp-list" id="compList"></ul>
  <div class="foot" style="margin-top:24px">
    <button class="link super-only" id="importBtn">匯入資料</button>
    <button class="link super-only" id="exportBtn">匯出備份</button>
    <button class="link" id="loginBtn">管理員登入</button>
    <input type="file" id="importInput" accept=".json,application/json" hidden>
  </div>
</section>

<!-- ===== 賽前設定 ===== -->
<section class="setup" id="setupView" hidden>
  <button class="back" id="setupBack">← 所有比賽</button>
  <h1>建立比賽</h1>
  <p class="rule">開始前決定組別、每組路線數量和計時方式，比賽中不會再變動。</p>
  <div class="card">
    <div class="field">
      <label for="sTitle">比賽名稱</label>
      <input class="text" id="sTitle" value="原岩模擬賽">
    </div>
    <div class="field">
      <label>組別與路線</label>
      <div id="divDraft"></div>
      <button type="button" class="link" id="addDiv">＋ 新增組別</button>
    </div>
    <div class="field">
      <label>每輪攀爬時間</label>
      <div class="stepper">
        <button type="button" data-step="climb" data-d="-1" aria-label="減少一分鐘">−</button>
        <output id="sClimb">4</output>
        <button type="button" data-step="climb" data-d="1" aria-label="增加一分鐘">＋</button>
        <span class="unit">分鐘</span>
      </div>
    </div>
    <div class="field">
      <label>每輪休息時間</label>
      <div class="stepper">
        <button type="button" data-step="rest" data-d="-1" aria-label="減少一分鐘">−</button>
        <output id="sRest">0</output>
        <button type="button" data-step="rest" data-d="1" aria-label="增加一分鐘">＋</button>
        <span class="unit">分鐘</span>
      </div>
      <p class="note">設 0 分鐘：每輪結束就停，手動開始下一輪。設 1 分鐘以上：攀爬、休息自動輪替。</p>
    </div>
    <button class="btn big" id="startComp">建立比賽</button>
  </div>
</section>

<!-- ===== 比賽畫面 ===== -->
<section id="compView" hidden>
  <div class="timer" id="timer">
    <div class="t-info">
      <div class="t-phase" id="tPhase"></div>
      <div class="t-clock" id="tClock"></div>
    </div>
    <div class="t-btns">
      <button class="main edit-only" id="tToggle">開始</button>
      <button class="edit-only" id="tNext" aria-label="跳到下一階段">⏭</button>
      <button class="edit-only" id="tReset" aria-label="重設這一輪">↺</button>
      <button id="tSound" aria-label="提示音開關">🔔</button>
    </div>
  </div>

  <button class="back" id="backBtn">← 所有比賽</button>
  <p class="title" id="title"></p>
  <p class="rule" id="ruleLine"></p>
  <div class="banner" id="modeBanner"></div>

  <section class="card" id="joinCard" hidden>
    <h2 style="margin-bottom:10px">報名參加</h2>
    <input class="text" id="joinName" placeholder="你的名字" autocomplete="name" style="margin-bottom:10px">
    <div class="seg" id="joinDivs"></div>
    <button class="btn big" id="joinBtn">報名</button>
    <p class="hint" id="joinMsg" style="margin:8px 0 0"></p>
  </section>
  <div class="banner" id="keyLine" hidden></div>
  <div class="sub" id="claimLine" hidden style="margin:-4px 0 12px"><span class="hint">你是這場比賽的主辦？</span><button class="link" id="claimBtn">輸入管理碼</button></div>
  <div class="sub" id="meLine" hidden style="margin:-4px 0 12px"><span class="hint" id="meText"></span><button class="link" id="leaveBtn">取消報名</button></div>

  <nav class="divtabs" id="divtabs" aria-label="組別"></nav>

  <div class="add edit-only">
    <input id="nameInput" placeholder="輸入選手名字報名" autocomplete="off">
    <button class="btn" id="addBtn" type="button">新增選手</button>
  </div>

  <nav class="tabs" id="tabs" aria-label="排行切換"></nav>

  <section class="card" id="nowCard" hidden>
    <div class="now-head">
      <div>
        <p class="now-route" id="nowRoute"></p>
        <p class="now-name" id="nowName"></p>
      </div>
      <div class="big-score" id="nowScore">0.0</div>
    </div>
    <p class="status" id="nowStatus"></p>
    <div class="strip" id="strip" aria-label="嘗試紀錄"></div>
    <div class="actions">
      <button class="act f" data-r="f">失敗<small>沒拿到 Zone</small></button>
      <button class="act z" data-r="z">Zone<small>這次到 Zone</small></button>
      <button class="act t" data-r="t">Top<small>完攀</small></button>
    </div>
    <div class="sub">
      <button class="link" id="undoBtn">復原上一筆</button>
      <button class="link danger" id="delBtn">刪除選手</button>
      <span class="hint" id="lockMsg" hidden>主辦還沒開放自行記分</span>
    </div>
  </section>

  <section class="card">
    <div class="board-head">
      <h2 id="boardTitle">總排行</h2>
      <span class="hint" id="boardHint"></span>
    </div>
    <div class="photo" id="photoBox" hidden><div class="pwrap" id="photoWrap"><img id="photoImg" alt="路線照片"><svg id="photoSvg" aria-hidden="true"></svg></div></div>
    <ol class="board" id="board"></ol>
    <div class="sub edit-only" id="routeTools" hidden>
      <button class="link" id="renameRouteBtn">重新命名路線</button>
      <button class="link" id="photoBtn">上傳路線照片</button>
      <button class="link" id="markBtn" hidden>圈路線</button>
      <button class="link danger" id="photoDelBtn" hidden>刪除照片</button>
      <input type="file" id="photoInput" accept="image/*" hidden>
    </div>
  </section>

  <div class="foot edit-only">
    <button class="link" id="selfToggle"></button>
    <button class="link danger" id="resetBtn">清除成績</button>
    <button class="link danger" id="delCompBtn">刪除這場比賽</button>
  </div>
</section>
</main>
<div class="lightbox" id="lightbox" hidden><div class="pwrap" id="lightWrap"><img id="lightImg" alt="路線照片放大"><svg id="lightSvg" aria-hidden="true"></svg></div></div>

<div class="editor" id="editor" hidden>
  <div class="ed-top">
    <button class="ed-cancel" id="edCancel">取消</button>
    <b id="edTitle">圈路線</b>
    <button class="ed-save" id="edSave">儲存</button>
  </div>
  <div class="ed-stage" id="edStage">
    <div class="pwrap" id="edWrap"><img id="edImg" alt="" draggable="false"><svg id="edSvg"></svg></div>
  </div>
  <div class="ed-bar">
    <div class="ed-tools" id="edTools">
      <button data-tool="hand" style="color:#2EE65C"><i></i>手點</button>
      <button data-tool="foot" style="color:#2EE65C"><i style="border-style:dashed"></i>腳點</button>
      <button data-tool="start" style="color:#3D9BFF"><i></i>Start</button>
      <button data-tool="zone" style="color:#FFC400"><i></i>Zone</button>
      <button data-tool="top" style="color:#FF4A3D"><i></i>Top</button>
    </div>
    <div class="ed-row">
      <span>大小</span><input type="range" id="edSize" min="0.012" max="0.12" step="0.002" value="0.035" aria-label="圈圈大小">
    </div>
    <div class="ed-row">
      <button id="edUndo">復原</button>
      <button id="edDel">刪除選取</button>
      <button id="edClear">全部清除</button>
    </div>
    <p class="ed-hint">點照片空白處加一個圈，拖曳可移動，點一下圈圈可選取後調整大小或刪除。</p>
  </div>
</div>

<script>
/* ================== 設定（請改成你自己的） ================== */
const FIREBASE_CONFIG = {
  apiKey: "貼上你的 apiKey",
  authDomain: "你的專案.firebaseapp.com",
  projectId: "你的專案 ID",
  storageBucket: "你的專案.appspot.com",
  messagingSenderId: "",
  appId: ""
};
const ADMIN_EMAILS = ["你的管理員email@example.com"];
/* ============================================================ */

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $ = id => document.getElementById(id);
const MIN = 60000;
const PREF_KEY = 'origin-climb-portal-prefs';

/* ---------- 狀態 ---------- */
let DB=null, mode='loading', readOnly=false, isAdmin=false, isSuper=false, coAdmin=false, compKey=null, myId=null, entryBlocked=false;
let page='portal';           // portal | setup | comp
let compId=null;
let comps={};                // 所有比賽清單
const M={ comp:null, climbers:{}, results:{}, photos:{}, entries:{} };
let compSubs=[], photoSubs={};

let prefs={ div:null, view:'total', selected:null, sound:true };
try{ prefs.sound = JSON.parse(localStorage.getItem(PREF_KEY)||'{}').sound!==false; }catch(e){}
function savePrefs(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify({sound:prefs.sound})); }catch(e){} }

let warned=false;
function onWriteError(e, mine){
  if(e&&e.code==='invalid_argument'){ if(mine) entryBlocked=true; else readOnly=true; render(); return; }
  if(e&&e.code==='quota_exceeded'){ alert('資料庫容量已滿，請刪除舊比賽或照片。'); return; }
  if(!warned){ warned=true; alert('資料沒有存成功，請檢查網路後再試一次。'); setTimeout(()=>warned=false,5000); }
}
async function put(path,data){ try{ data? await DB.doc(path).set(data) : await DB.doc(path).delete(); }catch(e){ onWriteError(e); } }

/* ---------- Firebase 連線 ---------- */
function mapErr(e){
  const m={'permission-denied':'invalid_argument','unauthenticated':'invalid_argument','resource-exhausted':'quota_exceeded','unavailable':'unavailable'};
  return {code:m[e&&e.code]||'unavailable', message:e&&e.message||''};
}
function FireDB(fs){
  const wrapDocSnap=s=>({id:s.id, exists:s.exists, data:()=>s.data()});
  return {
    doc:p=>{ const ref=fs.doc(p); return {
      get:()=>ref.get().then(wrapDocSnap).catch(e=>{throw mapErr(e);}),
      set:d=>ref.set(d).catch(e=>{throw mapErr(e);}),
      delete:()=>ref.delete().catch(e=>{throw mapErr(e);}),
      onSnapshot:(next,err)=>ref.onSnapshot(s=>next(wrapDocSnap(s)), e=>err&&err(mapErr(e)))
    }; },
    collection:c=>{ const ref=fs.collection(c); return {
      get:()=>ref.get().catch(e=>{throw mapErr(e);}),
      onSnapshot:(next,err)=>ref.onSnapshot(next, e=>err&&err(mapErr(e)))
    }; }
  };
}
let started=false, auth=null;
async function init(){
  if(!window.firebase || FIREBASE_CONFIG.apiKey.includes('貼上')){
    $('loadingView').textContent='尚未設定 Firebase，請依照說明把 FIREBASE_CONFIG 貼到 index.html。';
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth();
  DB=FireDB(firebase.firestore());
  mode='shared';
  auth.onAuthStateChanged(async user=>{
    if(!user){ try{ await auth.signInAnonymously(); }catch(e){ myId=null; isSuper=false; boot(); } return; }
    const changed = myId && myId!==user.uid;
    myId=user.uid;
    isSuper=!user.isAnonymous && ADMIN_EMAILS.map(x=>x.toLowerCase()).includes((user.email||'').toLowerCase());
    if(changed && compId){ const id=compId; openComp(id); }
    boot();
  });
}

}
function boot(){ if(!started){ started=true; startSubs(); } render(); }

function openComp(id){
  closeComp();

  M.comp=comps[id]||null; M.climbers={}; M.results={}; M.photos={};
  compSubs.push(DB.doc('comps/'+id).onSnapshot(s=>{
    if(compId!==id) return;
    if(!s.exists){ if(page==='comp'){ closeComp(); page='portal'; render(); } return; }
    M.comp=s.data(); loadKey(); render();
  }, onSubErr));
  const sub=n=>compSubs.push(DB.collection('comps/'+id+'/'+n).onSnapshot(s=>{
    if(compId!==id) return; const o={}; s.docs.forEach(d=>o[d.id]=d.data()); M[n]=o; render();
  }, onSubErr));
  sub('climbers'); sub('results');
  let firstEntries=true;
  compSubs.push(DB.collection('comps/'+id+'/entries').onSnapshot(s=>{
    if(compId!==id) return; const o={}; s.docs.forEach(d=>o[d.id]=d.data()); M.entries=o;
    if(firstEntries){ firstEntries=false; const me=myId&&o[myId]; if(me){ prefs.div=me.division; } }
    render();

  if(myId) compSubs.push(DB.doc('compAdmins/'+id+'_'+myId).onSnapshot(s=>{

/* ---------- 計分 ---------- */
function climbersIn(divId){
  const judge=Object.entries(M.climbers).filter(([,c])=>c.division===divId)
    .map(([id,c])=>({id,name:c.name,createdAt:c.createdAt||0}));
  const self=Object.keys(M.entries).map(u=>[u,entryOf(u)]).filter(([,e])=>e&&e.division===divId)
    .map(([u,e])=>({id:'u:'+u,name:e.name,createdAt:e.joinedAt||0,self:true,uid:u}));
  return [...judge,...self].sort((a,b)=>a.createdAt-b.createdAt||(a.id<b.id?-1:1));
}
function climberById(id){
  if(id&&id.startsWith('u:')){ const e=entryOf(id.slice(2)); return e?{name:e.name,division:e.division}:null; }
  return M.climbers[id]||null;
}
const rKey=(cid,rid)=>cid+'__'+rid;
function attemptsOf(cid,rid){
  if(cid&&cid.startsWith('u:')){ const e=entryOf(cid.slice(2)); const a=e&&e.results&&e.results[rid]; return Array.isArray(a)?a:[]; }
  const r=M.results[rKey(cid,rid)]; return (r&&Array.isArray(r.attempts))?r.attempts:[];
}
function setAttempts(cid,rid,arr){
  if(cid.startsWith('u:')){
    return editEntry(cid.slice(2), e=>{ if(!e) return null; e.results=e.results||{}; e.results[rid]=arr; return e; });
  }
  return wResult(rKey(cid,rid),{climberId:cid,routeId:rid,attempts:arr});
}
function calcRoute(arr){
  let zoneAt=null,topAt=null;
  arr.forEach((r,i)=>{ if((r==='z'||r==='t')&&zoneAt===null) zoneAt=i+1; if(r==='t'&&topAt===null) topAt=i+1; });
  let score=0; if(topAt) score=25-0.1*(topAt-1); else if(zoneAt) score=10-0.1*(zoneAt-1);
  return { zoneAt, topAt, score:Math.max(0,Math.round(score*10)/10), total:arr.length };
}
function calcTotal(cid,div){
  let score=0,tops=0,zones=0,attempts=0;
  const per=div.routes.map(r=>{ const s=calcRoute(attemptsOf(cid,r.id)); score+=s.score; attempts+=s.total; if(s.topAt)tops++; if(s.zoneAt)zones++; return {route:r,...s}; });
  return { score:Math.round(score*10)/10, tops, zones, attempts, per };
}
function rankList(items){ let prev=null,pr=0; return items.map((it,i)=>{ const rank=it.score===prev?pr:i+1; prev=it.score; pr=rank; return {...it,rank}; }); }
function esc(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------- 計時器 ---------- */
function cfg(){ return M.comp.config; }
function elapsedNow(){ const t=M.comp.timer; return t.running ? t.elapsed+(Date.now()-t.startedAt) : t.elapsed; }
function timerView(){
  const t=M.comp.timer, c=cfg(), climb=c.climbMin*MIN, rest=c.restMin*MIN, E=Math.max(0,elapsedNow());
  if(rest>0){
    const cycle=climb+rest, n=Math.floor(E/cycle), within=E-n*cycle, inClimb=within<climb;
    return { round:t.round+n, phase:inClimb?'climb':'rest', remain:inClimb?climb-within:cycle-within, over:false, cycleStart:n*cycle };
  }
  return { round:t.round, phase:'climb', remain:Math.max(0,climb-E), over:E>=climb, cycleStart:0 };
}
function fmt(ms){ const s=Math.ceil(ms/1000),m=Math.floor(s/60),r=s%60; return `${m}:${String(r).padStart(2,'0')}`; }
function setTimer(p){ return wComp({...M.comp, timer:{...M.comp.timer,...p}}); }
$('tToggle').onclick=()=>{

  if(t.running) setTimer({running:false,elapsed:elapsedNow()});
  else setTimer({running:true,startedAt:Date.now()});
};

  else setTimer({round:t.round+1,elapsed:0,running:false});
};

let audioCtx=null, wakeLock=null, last=null;
function beep(freq=880,dur=0.15,times=1){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    if(!prefs.sound||!freq) return;
    for(let i=0;i<times;i++){
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
      const t=audioCtx.currentTime+i*(dur+0.12);
      g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.start(t); o.stop(t+dur);
    }
  }catch(e){}
  try{ if(prefs.sound&&freq&&navigator.vibrate) navigator.vibrate(dur>0.5?600:120); }catch(e){}
}
document.addEventListener('pointerdown',()=>beep(0,0.001),{once:true});
async function keepAwake(on){
  try{
    if(on&&'wakeLock' in navigator&&!wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>wakeLock=null); }
    if(!on&&wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){}
}
function tick(){
  if(!M.comp||!M.comp.setupDone||!divisions().length) return;
  const t=M.comp.timer,v=timerView(),sec=Math.ceil(v.remain/1000),key=v.round+v.phase;
  if(t.running&&last){
    if(last.key!==key||(!last.over&&v.over)) beep(last.phase==='climb'?440:1040,0.8);
    else if(sec!==last.sec){
      if(v.phase==='climb'&&sec===60&&cfg().climbMin>1) beep(660,0.25,2);
      if(sec>=1&&sec<=5) beep(880,0.12);
    }
  }
  last={key,sec,over:v.over,phase:v.phase};
  keepAwake(t.running&&!v.over);
  renderTimer();
}
function renderTimer(){
  if(!M.comp||!M.comp.setupDone||!divisions().length) return;
  const t=M.comp.timer,v=timerView(),el=$('timer');
  $('tClock').textContent=v.over?'時間到':fmt(v.remain);
  $('tPhase').textContent=`第 ${v.round} 輪・`+(v.phase==='climb'?'攀爬':'休息／換場')+(t.running||v.over?'':'（暫停）');
  el.classList.toggle('rest',v.phase==='rest');
  el.classList.toggle('warn',v.phase==='climb'&&!v.over&&v.remain<=60000);
  el.classList.toggle('over',v.over);
  $('tToggle').textContent=v.over?'下一輪':t.running?'暫停':(elapsedNow()>0?'繼續':'開始');
  $('tSound').textContent=prefs.sound?'🔔':'🔕';
}


/* ---------- 路線照片 ---------- */
function resizeImage(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight; const max=1000, k=Math.min(1,max/Math.max(w,h));
      w=Math.round(w*k); h=Math.round(h*k);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      let q=0.75, out=cv.toDataURL('image/jpeg',q);
      while(out.length>220000 && q>0.3){ q-=0.1; out=cv.toDataURL('image/jpeg',q); }
      res({data:out,w,h});
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); };
    img.src=url;
  });
}

/* ---------- 標記繪製 ---------- */
const MARK = {
  hand:{color:'#2EE65C', label:''}, foot:{color:'#2EE65C', label:'', dash:true},
  start:{color:'#3D9BFF', label:'S'}, zone:{color:'#FFC400', label:'Z'}, top:{color:'#FF4A3D', label:'T'}
};
function dims(ph, imgEl){
  const w=ph.w||(imgEl&&imgEl.naturalWidth)||1000, h=ph.h||(imgEl&&imgEl.naturalHeight)||750;
  return {w,h,VH:1000*h/w};
}
function drawMarks(svg, marks, VH, sel){
  svg.setAttribute('viewBox',`0 0 1000 ${VH}`);
  let out='';
  (marks||[]).forEach((m,i)=>{
    const t=MARK[m.type]||MARK.hand, cx=m.x*1000, cy=m.y*VH, r=m.r*1000;
    const dash=t.dash?'stroke-dasharray="14 9"':'';
    out+=`<g data-i="${i}">`;
    out+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="transparent" stroke="#000" stroke-opacity=".7" stroke-width="11" ${dash}/>`;
    out+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="transparent" stroke="${t.color}" stroke-width="6" ${dash}/>`;
    if(t.label){
      const lx=cx+r*0.78, ly=cy-r*0.78, lr=Math.max(17, r*0.42);
      out+=`<circle cx="${lx}" cy="${ly}" r="${lr}" fill="${t.color}" stroke="#000" stroke-opacity=".7" stroke-width="3"/>`;
      out+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-size="${lr*1.25}" font-weight="900" font-family="system-ui,sans-serif" fill="${m.type==='zone'?'#2A2000':'#fff'}">${t.label}</text>`;
    }
    if(i===sel) out+=`<circle cx="${cx}" cy="${cy}" r="${r+14}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 6"/>`;
    out+=`</g>`;
  });
  svg.innerHTML=out;
}
function fitWrap(wrap, w, h, maxW, maxH){
  const width=Math.min(maxW, maxH*w/h);
  wrap.style.width=width+'px';
}
function layoutLight(){
  const ph=M.photos[prefs.view]; if(!ph||$('lightbox').hidden) return;
  const d=dims(ph,$('lightImg'));
  fitWrap($('lightWrap'), d.w, d.h, window.innerWidth, window.innerHeight-40);
  drawMarks($('lightSvg'), ph.marks, d.VH, -1);
}
function layoutPhoto(ph){
  const d=dims(ph,$('photoImg'));
  fitWrap($('photoWrap'), d.w, d.h, $('photoBox').clientWidth||600, 380);
  drawMarks($('photoSvg'), ph.marks, d.VH, -1);
}
$('photoImg').onload=()=>{ const ph=M.photos[prefs.view]; if(ph) layoutPhoto(ph); };
$('lightImg').onload=layoutLight;
window.addEventListener('resize',()=>{ const ph=M.photos[prefs.view]; if(ph&&!$('photoBox').hidden) layoutPhoto(ph); layoutLight(); if(!$('editor').hidden) layoutEditor(); });


/* ---------- 圈路線編輯器 ---------- */
const ed={rid:null, marks:[], hist:[], sel:-1, tool:'hand', size:0.035, drag:null, d:null};
function openEditor(rid){
  const ph=M.photos[rid]; if(!ph) return;
  const div=curDiv(), r=div.routes.find(x=>x.id===rid);
  ed.rid=rid; ed.marks=JSON.parse(JSON.stringify(ph.marks||[])); ed.hist=[]; ed.sel=-1; ed.drag=null;
  $('edTitle').textContent=`圈路線・${div.name} ${r?r.name:''}`;
  $('edImg').src=ph.data;
  $('editor').hidden=false; document.body.style.overflow='hidden';
  renderTools(); layoutEditor();
}
function closeEditor(){ $('editor').hidden=true; document.body.style.overflow=''; }
function layoutEditor(){
  const ph=M.photos[ed.rid]; if(!ph) return;
  ed.d=dims(ph,$('edImg'));
  const st=$('edStage');
  fitWrap($('edWrap'), ed.d.w, ed.d.h, st.clientWidth-16, st.clientHeight-16);
  drawEd();
}
$('edImg').onload=layoutEditor;
function drawEd(){
  drawMarks($('edSvg'), ed.marks, ed.d.VH, ed.sel);
  $('edUndo').disabled=!ed.hist.length;
  $('edDel').disabled=ed.sel<0;
  $('edClear').disabled=!ed.marks.length;
  $('edSize').value = ed.sel>=0 ? ed.marks[ed.sel].r : ed.size;
}
function renderTools(){
  document.querySelectorAll('#edTools button').forEach(b=>b.classList.toggle('on', b.dataset.tool===ed.tool));
}
function snapshot(){ ed.hist.push(JSON.stringify(ed.marks)); if(ed.hist.length>60) ed.hist.shift(); }
function toPt(e){
  const r=$('edSvg').getBoundingClientRect();
  return { x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)), y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)) };
}
document.querySelectorAll('#edTools button').forEach(b=>b.onclick=()=>{
  ed.tool=b.dataset.tool; renderTools();
  if(ed.sel>=0){ snapshot(); ed.marks[ed.sel].type=ed.tool; drawEd(); }
});
$('edSvg').addEventListener('pointerdown',e=>{
  e.preventDefault();
  const g=e.target.closest('g[data-i]'), p=toPt(e);
  $('edSvg').setPointerCapture(e.pointerId);
  if(g){
    const i=Number(g.dataset.i), m=ed.marks[i];
    ed.sel=i; ed.tool=m.type; renderTools();
    ed.drag={i, ox:p.x-m.x, oy:p.y-m.y, moved:false};
  } else {
    snapshot();
    ed.marks.push({x:p.x, y:p.y, r:ed.size, type:ed.tool});
    ed.sel=ed.marks.length-1;
    ed.drag={i:ed.sel, ox:0, oy:0, moved:true};
  }
  drawEd();
});
$('edSvg').addEventListener('pointermove',e=>{
  if(!ed.drag) return;
  const p=toPt(e), m=ed.marks[ed.drag.i];
  if(!ed.drag.moved){ snapshot(); ed.drag.moved=true; }
  m.x=Math.min(1,Math.max(0,p.x-ed.drag.ox)); m.y=Math.min(1,Math.max(0,p.y-ed.drag.oy));
  drawEd();
});
const endDrag=()=>{ ed.drag=null; };
$('edSvg').addEventListener('pointerup',endDrag);
$('edSvg').addEventListener('pointercancel',endDrag);
$('edSize').addEventListener('input',e=>{
  const v=Number(e.target.value); ed.size=v;
  if(ed.sel>=0){ ed.marks[ed.sel].r=v; drawMarks($('edSvg'), ed.marks, ed.d.VH, ed.sel); }
});
$('edSize').addEventListener('pointerdown',()=>{ if(ed.sel>=0) snapshot(); });
$('edUndo').onclick=()=>{ if(!ed.hist.length) return; ed.marks=JSON.parse(ed.hist.pop()); ed.sel=-1; drawEd(); };
$('edDel').onclick=()=>{ if(ed.sel<0) return; snapshot(); ed.marks.splice(ed.sel,1); ed.sel=-1; drawEd(); };
$('edClear').onclick=()=>{ if(!confirm('清除所有標記？')) return; snapshot(); ed.marks=[]; ed.sel=-1; drawEd(); };
$('edCancel').onclick=()=>{ if(ed.hist.length && !confirm('放棄這次的修改？')) return; closeEditor(); };
$('edSave').onclick=async()=>{
  const ph=M.photos[ed.rid]; if(!ph) return closeEditor();
  $('edSave').disabled=true;
  const d=ed.d||dims(ph,$('edImg'));
  await wPhoto(ed.rid,{...ph, w:d.w, h:d.h, marks:ed.marks.map(m=>({x:+m.x.toFixed(4), y:+m.y.toFixed(4), r:+m.r.toFixed(4), type:m.type})), at:Date.now()});
  $('edSave').disabled=false; closeEditor();
};


/* ---------- 路線照片上傳 ---------- */
$('photoBtn').onclick=()=>$('photoInput').click();
$('photoInput').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const rid=prefs.view; if(rid==='total') return;
  $('photoBtn').textContent='上傳中…'; $('photoBtn').disabled=true;
  let ok=false;
  try{ const img=await resizeImage(f); M.photos[rid]={data:img.data,w:img.w,h:img.h,marks:[],at:Date.now()}; await wPhoto(rid,M.photos[rid]); ok=true; }
  catch(err){ alert('這張照片讀不出來，換一張試試看。'); }
  $('photoBtn').disabled=false; render();
  if(ok) setTimeout(()=>openEditor(rid),300);
};
$('photoDelBtn').onclick=()=>{ if(confirm('刪除這條路線的照片和標記？')){ delete M.photos[prefs.view]; wPhoto(prefs.view,null); } };
$('markBtn').onclick=()=>openEditor(prefs.view);
$('photoBox').onclick=()=>{ const ph=M.photos[prefs.view]; if(!ph) return; $('lightImg').src=ph.data; $('lightbox').hidden=false; layoutLight(); };
$('lightbox').onclick=()=>{ $('lightbox').hidden=true; };

/* ---------- 畫面 ---------- */
function banner(){
  if(mode==='local') return '<b>單機模式</b>：資料只存在這台裝置。';
  if(page!=='comp') return isSuper ? '<b>系統管理員</b>：可以管理所有比賽。' : '任何人都可以建立比賽；建立的人負責計時和管理。';
  if(isAdmin) return '<b>主辦</b>：你負責計時，也可以幫任何選手記分。';
  if(!myId||entryBlocked) return '<b>觀看模式</b>：目前無法報名，請重新整理頁面再試一次。';
  return myEntry() ? '<b>選手</b>：切到路線就能記錄自己的成績。' : '<b>選手</b>：填名字報名後，就能自己記錄成績。';
}
function renderPortal(){
  $('portalBanner').innerHTML=banner();
  const u=auth&&auth.currentUser; $('loginBtn').textContent=(u&&!u.isAnonymous)?`登出（${u.email}）`:'管理員登入';
  const list=$('compList'); list.innerHTML='';
  const items=Object.entries(comps).filter(([,c])=>c&&c.setupDone&&Array.isArray(c.divisions))
    .sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
  if(!items.length){ list.innerHTML=`<li class="empty">還沒有比賽，按上面的按鈕建立第一場。</li>`; return; }
  items.forEach(([id,c])=>{
    const li=document.createElement('li'); li.className='comp-item'; li.tabIndex=0;
    const d=c.createdAt?new Date(c.createdAt):null;
    const date=d?`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`:'';
    const live=c.timer&&c.timer.running, mine=myId&&c.ownerId===myId;
    li.innerHTML=`<div><h3></h3><p>${esc(date)}・${c.divisions.map(x=>esc(x.name)+' '+x.routes.length+' 條').join('、')}</p></div><span class="badge${live?' live':''}">${live?'進行中':mine?'我主辦':'查看'}</span>`;
    li.querySelector('h3').textContent=c.title||'未命名比賽';
    li.onclick=()=>openComp(id);
    li.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openComp(id); } };
    list.appendChild(li);
  });
}
function render(){
  if(mode==='loading') return;
  $('loadingView').hidden=true;
  refreshRole();
  document.querySelectorAll('.edit-only').forEach(e=>e.style.display=(page==='comp'&&isAdmin)?'':'none');
  document.querySelectorAll('.super-only').forEach(e=>e.style.display=isSuper?'':'none');
  $('newCompBtn').hidden=!myId;
  if(page==='setup'&&!myId) page='portal';
  const inComp = page==='comp' && M.comp && M.comp.setupDone && divisions().length;
  $('portalView').hidden = page!=='portal';
  $('setupView').hidden = page!=='setup';
  $('compView').hidden = !inComp;
  if(page==='portal'){ renderPortal(); return; }
  if(page==='setup'){ renderSetup(); return; }
  if(!inComp){ $('loadingView').hidden=false; return; }

  const ds=divisions(), div=curDiv(), c1=cfg();
  prefs.div=div.id;
  const rs=div.routes;
  if(prefs.view!=='total'&&!rs.some(r=>r.id===prefs.view)) prefs.view='total';
  if(prefs.selected&&(!climberById(prefs.selected)||climberById(prefs.selected).division!==div.id)) prefs.selected=null;
  if(prefs.view!=='total') watchPhoto(prefs.view);
  const photoSet=new Set(M.comp.photoRoutes||[]);

  $('title').textContent=M.comp.title;
  $('ruleLine').textContent=ds.map(d=>`${d.name} ${d.routes.length} 條`).join('、')+`・每輪攀爬 ${c1.climbMin} 分鐘`+(c1.restMin?`、休息 ${c1.restMin} 分鐘`:'')+'。Zone 10 分、Top 25 分，第二次起每次扣 0.1 分。';
  $('modeBanner').innerHTML=banner();
  const me=myEntry(), selfOpen=M.comp.selfScoring!==false;
  $('keyLine').hidden=!(isAdmin&&compKey);
  if(isAdmin&&compKey) $('keyLine').innerHTML=`<b>管理碼：${esc(compKey)}</b>　換手機時輸入可拿回管理權，也可以給裁判。請勿公開。`;
  $('claimLine').hidden=isAdmin||!myId;
  const canJoin=!isAdmin&&myId&&!entryBlocked;
  $('joinCard').hidden=!(canJoin&&!me);
  if(canJoin&&!me){
    const jd=$('joinDivs'); jd.innerHTML='';
    if(!ds.some(d=>d.id===joinDiv)) joinDiv=div.id;
    ds.forEach(d=>{ const b=document.createElement('button'); b.type='button'; b.className=d.id===joinDiv?'on':''; b.textContent=d.name; b.onclick=()=>{ joinDiv=d.id; render(); }; jd.appendChild(b); });
  }
  $('meLine').hidden=!(me&&!isAdmin);
  if(me&&!isAdmin){
    const md=ds.find(d=>d.id===me.division);
    $('meText').textContent=`你以「${me.name}」報名${md?md.name:''}`+(selfOpen?'':'・主辦尚未開放自行記分');
  }
  $('selfToggle').textContent=selfOpen?'選手自行記分：開放中（點此關閉）':'選手自行記分：已關閉（點此開放）';

  const dt=$('divtabs'); dt.innerHTML=''; dt.hidden=ds.length<2;
  ds.forEach(d=>{ const b=document.createElement('button'); b.className='divtab'+(d.id===div.id?' on':''); b.textContent=d.name;
    b.onclick=()=>{ prefs.div=d.id; prefs.view='total'; prefs.selected=null; render(); }; dt.appendChild(b); });
  $('nameInput').placeholder=`輸入選手名字報名${div.name}`;

  const tabs=$('tabs'); tabs.innerHTML='';
  const mk=(label,cls,on,fn)=>{ const b=document.createElement('button'); b.className='tab '+cls+(on?' on':''); b.textContent=label; b.onclick=fn; tabs.appendChild(b); };
  mk('總排行','total',prefs.view==='total',()=>{prefs.view='total';render();});
  rs.forEach(r=>mk(r.name+(photoSet.has(r.id)?' 📷':''),'',prefs.view===r.id,()=>{prefs.view=r.id;render();}));

  const board=$('board'); board.innerHTML='';
  const list=climbersIn(div.id), route=rs.find(r=>r.id===prefs.view);
  if(!list.length) board.innerHTML=`<li class="empty">${esc(div.name)}還沒有選手。</li>`;
  const makeRow=(r,detail)=>{
    const li=document.createElement('li');
    li.className='row'+(readOnly?'':' click')+(r.c.id===prefs.selected&&!readOnly?' sel':'')+(r.c.uid&&r.c.uid===myId&&!isAdmin?' me':'');
    li.innerHTML=`<div class="rank${r.rank===1?' p1':''}">${r.rank}</div><div><div class="rname"></div>${detail}</div><div class="rscore">${r.score.toFixed(1)}</div>`;
    li.querySelector('.rname').textContent=r.c.name;
    if(!readOnly){
      li.tabIndex=0;
      const pick=()=>{ prefs.selected=r.c.id; if(prefs.view==='total') prefs.view=rs[0].id; render(); $('nowCard').scrollIntoView({behavior:'smooth',block:'nearest'}); };
      li.onclick=pick; li.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } };
    }
    return li;
  };
  const photo=route&&M.photos[route.id];
  $('photoBox').hidden=!photo;
  if(photo){ if($('photoImg').getAttribute('src')!==photo.data) $('photoImg').src=photo.data; else layoutPhoto(photo); }
  if(!route){
    $('boardTitle').textContent=`${div.name} 總排行`;
    $('boardHint').textContent=`${rs.length} 條路線加總`;
    $('routeTools').hidden=true;
    rankList(list.map((c,idx)=>({c,idx,...calcTotal(c.id,div)})).sort((a,b)=>b.score-a.score||b.tops-a.tops||b.zones-a.zones||a.idx-b.idx))
      .forEach(r=>{
        const mini=r.per.map(p=>`<span class="${p.topAt?'t':p.zoneAt?'z':''}">${esc(p.route.name)} ${p.score.toFixed(1)}</span>`).join('');
        board.appendChild(makeRow(r,`<div class="rdetail">${r.tops}T ${r.zones}Z・共 ${r.attempts} 次</div><div class="mini">${mini}</div>`));
      });
  } else {
    $('boardTitle').textContent=`${div.name}・${route.name}`;
    $('boardHint').textContent=photoSet.has(route.id)&&!photo?'照片載入中…':(readOnly?'':'點選手開始記錄');
    $('routeTools').hidden=false;
    $('photoBtn').textContent=photo?'更換路線照片':'上傳路線照片';
    $('photoDelBtn').hidden=!photo; $('markBtn').hidden=!photo;
    rankList(list.map((c,idx)=>({c,idx,...calcRoute(attemptsOf(c.id,route.id))})).sort((a,b)=>b.score-a.score||a.idx-b.idx))
      .forEach(r=>{
        const d=r.topAt?`第 ${r.topAt} 次 Top`:r.zoneAt?`第 ${r.zoneAt} 次 Zone`:r.total?'尚未得分':'還沒爬';
        board.appendChild(makeRow(r,`<div class="rdetail">${d}・共 ${r.total} 次</div>`));
      });
  }

  let showCard=false;
  if(isAdmin){ showCard=!!(prefs.selected&&climberById(prefs.selected)&&route); }
  else if(me&&route&&me.division===div.id){ prefs.selected='u:'+myId; showCard=true; }
  const c=prefs.selected&&climberById(prefs.selected);
  $('nowCard').hidden=!showCard;
  $('delBtn').hidden=!isAdmin;
  const locked=!isAdmin&&!selfOpen;
  $('lockMsg').hidden=!locked;
  if(showCard&&c){
    const arr=attemptsOf(prefs.selected,route.id),s=calcRoute(arr);
    $('nowRoute').textContent=`${div.name}・${route.name}`;
    $('nowName').textContent=c.name;
    $('nowScore').textContent=s.score.toFixed(1);
    $('nowStatus').textContent=s.topAt?`已完攀（第 ${s.topAt} 次）`:s.zoneAt?`第 ${s.zoneAt} 次拿到 Zone，繼續挑戰 Top`:`目前第 ${s.total+1} 次嘗試`;
    const strip=$('strip'); strip.innerHTML='';
    arr.forEach(x=>{ const d=document.createElement('span'); d.className='chip '+x; d.textContent=x==='f'?'✕':x==='z'?'Z':'T'; strip.appendChild(d); });
    document.querySelectorAll('.act').forEach(b=>b.disabled=!!s.topAt||locked);
    $('undoBtn').disabled=!arr.length||locked;
  }
  renderTimer();
}

/* ---------- 操作 ---------- */
function addClimber(){
  const name=$('nameInput').value.trim(); if(!name){ $('nameInput').focus(); return; }
  const div=curDiv(), id=uid();
  wClimber(id,{name,division:div.id,createdAt:Date.now()});
  prefs.selected=id; if(prefs.view==='total') prefs.view=div.routes[0].id;
  $('nameInput').value='';
}
$('addBtn').onclick=addClimber;
$('nameInput').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); addClimber(); } };
function canRecord(){ return isAdmin || (M.comp.selfScoring!==false && prefs.selected==='u:'+myId); }
document.querySelectorAll('.act').forEach(b=>b.onclick=()=>{
  const cid=prefs.selected, route=curDiv().routes.find(r=>r.id===prefs.view);
  if(!cid||!route||!canRecord()) return;
  const arr=attemptsOf(cid,route.id); if(calcRoute(arr).topAt) return;
  setAttempts(cid,route.id,[...arr,b.dataset.r]);
});
$('undoBtn').onclick=()=>{
  const cid=prefs.selected,rid=prefs.view; if(!cid||!canRecord()) return;
  const arr=attemptsOf(cid,rid); if(!arr.length) return;
  setAttempts(cid,rid,arr.slice(0,-1));
};
$('delBtn').onclick=()=>{
  const cid=prefs.selected,c=climberById(cid); if(!c||!isAdmin) return;
  if(!confirm(`刪除「${c.name}」和他在所有路線的紀錄？`)) return;
  if(cid.startsWith('u:')){ editEntry(cid.slice(2), ()=>null); }
  else { allRoutes().forEach(r=>{ if(M.results[rKey(cid,r.id)]) wResult(rKey(cid,r.id),null); }); wClimber(cid,null); }
  prefs.selected=null;
};
let joinDiv=null;
$('joinBtn').onclick=()=>{
  const name=$('joinName').value.trim();
  if(!name){ $('joinName').focus(); $('joinMsg').textContent='請先輸入名字。'; return; }
  const div=divisions().find(d=>d.id===joinDiv)||curDiv(), id=compId;
  $('joinMsg').textContent='';
  editEntry(myId, ()=>({name, division:div.id, joinedAt:Date.now(), results:{}}));
  prefs.div=div.id; prefs.view=div.routes[0].id;
};
$('leaveBtn').onclick=()=>{
  const me=myEntry(); if(!me) return;
  if(!confirm('取消報名會刪除你在這場比賽的所有成績，確定嗎？')) return;
  editEntry(myId, ()=>null); prefs.selected=null; prefs.view='total';
};
$('claimBtn').onclick=async()=>{
  const k=(prompt('輸入這場比賽的管理碼')||'').trim().toUpperCase(); if(!k) return;
  try{ await DB.doc('compAdmins/'+compId+'_'+myId).set({compId, uid:myId, key:k}); }
  catch(e){ alert('管理碼不正確。'); }
};
$('selfToggle').onclick=()=>{ if(isAdmin) wComp({...M.comp, selfScoring: M.comp.selfScoring===false}); };
$('renameRouteBtn').onclick=()=>{
  const div=curDiv(), r=div.routes.find(x=>x.id===prefs.view); if(!r) return;
  const name=prompt('路線名稱',r.name); if(!name||!name.trim()) return;
  wComp({...M.comp, divisions:divisions().map(d=>d.id!==div.id?d:{...d,routes:d.routes.map(x=>x.id===r.id?{...x,name:name.trim()}:x)})});
};
$('resetBtn').onclick=async()=>{
  if(!confirm('清除這場比賽所有選手和成績？組別、路線、照片和計時設定會保留。')) return;
  await Promise.all([...Object.keys(M.results).map(id=>wResult(id,null)), ...Object.keys(M.climbers).map(id=>wClimber(id,null))]);
  const id=compId;
  Object.keys(M.entries).forEach(u=>editEntry(u, ()=>null));
  await wComp({...M.comp, timer:{round:1,running:false,elapsed:0,startedAt:0}});
  prefs.selected=null;
};
$('delCompBtn').onclick=async()=>{
  if(!confirm(`刪除「${M.comp.title}」？所有選手、成績和照片都會一起刪除，無法復原。`)) return;
  const b=base(), photos=M.comp.photoRoutes||[], cl=Object.keys(M.climbers), rs=Object.keys(M.results);
  const id=compId;
  const en=Object.keys(M.entries);
  closeComp(); page='portal'; render();
  await Promise.all(en.map(u=>put(b+'/entries/'+u,null)));
  try{ await DB.doc('compKeys/'+id).delete(); }catch(e){}
  await Promise.all([...rs.map(id=>put(b+'/results/'+id,null)), ...cl.map(id=>put(b+'/climbers/'+id,null)), ...photos.map(id=>put(b+'/photos/'+id,null))]);
  await put(b,null);
};

init();
setInterval(tick,250);
</script>
